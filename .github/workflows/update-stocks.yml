name: update-stocks
# 주식 시세 자동 수집 → data/stocks/에 저장(커밋) → Pages 다시 배포
on:
  schedule:
    # 시간은 UTC. 한국장(09:00~15:30 KST = 00:00~06:30 UTC) 30분마다
    - cron: '7,37 0-6 * * 1-5'
    # 미국장(서머타임 13:30~20:00 UTC, 겨울 14:30~21:00 UTC) 30분마다
    - cron: '7,37 13-21 * * 1-5'
    # 장 마감 뒤 한 번 더 (한국 16:12 KST, 미국 마감 후)
    - cron: '12 7 * * 1-5'
    - cron: '22 22 * * 1-5'
  push:
    branches: [main]
    paths: [config/stocks.json, scripts/fetch-stocks.mjs]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-stocks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 시세 받기
        run: node scripts/fetch-stocks.mjs
      - name: 저장소에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "주식 시세 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          pushed=0
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && { pushed=1; break; }; sleep 5; done
          if [ "$pushed" != 1 ]; then echo "푸시 3번 모두 실패"; exit 1; fi

  deploy:
    needs: fetch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
