name: probe-sources
# 데이터 출처 시험 — Actions 탭에서 "Run workflow"로 수동 실행
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/probe.sh
      - run: node tools/probe-ws.mjs
