name: probe-sources
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-gauss-2lh4jo]
    paths: [tools/probe*, .github/workflows/probe-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/probe.sh
      - run: node tools/probe-ws.mjs
